services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: tekora
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tekora123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
