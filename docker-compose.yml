services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: tekora
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tekora123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  product:
    build:
      context: .
      dockerfile: services/product/Dockerfile
    env_file:
      - ./services/product/.env
    depends_on:
      db:
        condition: service_healthy

  user:
    build:
      context: .
      dockerfile: services/user/Dockerfile
    env_file:
      - ./services/user/.env
    depends_on:
      db:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    env_file:
      - ./services/gateway/.env
    ports:
      - "8080:8080"
    depends_on:
      - product
      - user

volumes:
  postgres_data:
