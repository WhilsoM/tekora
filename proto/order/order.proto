syntax = "proto3";

option go_package = "tekora/pkg/gen/order;orderpb";

import "google/protobuf/timestamp.proto";

service OrderService {
    rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
    rpc GetOrderByID(GetOrderByIDRequest) returns (GetOrderByIDResponse);
    rpc DeleteOrderByID(DeleteOrderByIDRequest) returns (DeleteOrderByIDResponse);
    rpc UpdateOrderByID(UpdateOrderByIDRequest) returns (UpdateOrderByIDResponse);
}

message OrderItem {
    uint32 id = 1;
    uint32 order_id = 2;
    uint32 product_id = 3;
    string product_name = 4;
    uint32 unit_price = 5;
    uint32 quantity = 6;
}

message Order {
    uint32 id = 1;
    uint32 user_id = 2;
    uint32 total_amount = 3;
    string currency = 4;
    string status = 5;
    google.protobuf.Timestamp created_at = 6;
}

message CreateOrderItem {
    uint32 product_id = 1;
    string product_name = 2;
    uint32 unit_price = 3;
    uint32 quantity = 4;
}

message CreateOrderRequest {
    uint32 user_id = 1;
    repeated CreateOrderItem items = 2;
}

message CreateOrderResponse {
    Order order = 1;
}

message GetOrderByIDRequest {
    uint32 id = 1;
}

message GetOrderByIDResponse {
    repeated OrderItem items = 1;
}

message DeleteOrderByIDRequest {
    uint32 id = 1;
}

message DeleteOrderByIDResponse {
    string message = 1;
}

message UpdateOrderByIDRequest {
    uint32 id = 1;
    optional string status = 2;
}

message UpdateOrderByIDResponse {
    Order order = 1;
}
